name: dig-ci
on:
  push:
    paths: ["dig/**", ".github/workflows/dig-ci.yml"]
  pull_request:
    paths: ["dig/**", ".github/workflows/dig-ci.yml"]
jobs:
  check:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: dig } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: dig/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env: { DIG_DB: memory }
  e2e:
    runs-on: ubuntu-latest
    needs: check
    defaults: { run: { working-directory: dig } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: dig/package-lock.json }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env: { CI: "1" }
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: dig/playwright-report }
