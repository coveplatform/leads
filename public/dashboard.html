<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#fafaf8" />
<title>Cove</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #fafaf8; --card: #fff; --ink: #18181b; --muted: #6b6b73; --faint: #a1a1aa; --line: #e7e5e0;
    --brand: #e8540a; --brand-soft: #fff2ea; --red: #dc2626; --red-soft: #fef2f2;
    --green: #15803d; --green-soft: #f0fdf4; --amber: #b45309; --amber-soft: #fffbeb;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111110; --card: #1c1c1a; --ink: #f4f4f5; --muted: #a1a1aa; --faint: #71717a; --line: #2e2e2b;
      --brand-soft: #2a1a10; --red-soft: #2a1414; --green-soft: #12221a; --amber-soft: #2a2010; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.45 "Plus Jakarta Sans", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  main { max-width: 640px; margin: 0 auto; padding: 16px 16px 64px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 0 4px; }
  h1 { font-size: 1.15rem; margin: 0; font-weight: 800; letter-spacing: -.01em; }
  h2 { font-size: .78rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 28px 0 10px; font-weight: 700; }
  .sub { color: var(--muted); font-size: .85rem; }
  .net { font-size: .78rem; color: var(--amber); background: var(--amber-soft); padding: 3px 9px; border-radius: 99px; display: none; white-space: nowrap; }
  .net.on { display: inline-block; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-bottom: 10px; }
  .lead.urgent { border-left: 5px solid var(--red); }
  .lead .top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; cursor: pointer; }
  .phone { font-weight: 800; font-size: 1.15rem; letter-spacing: .01em; }
  .ago { color: var(--muted); font-size: .85rem; white-space: nowrap; }
  .answer { margin: 4px 0 0; font-weight: 600; cursor: pointer; }
  .urgent .answer { color: var(--red); }
  .booking { margin-top: 6px; font-size: .9rem; color: var(--muted); }
  .booking b { color: var(--ink); }
  .row { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .btn { flex: 1; min-width: 72px; border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 10px; padding: 11px 10px; font: inherit; font-weight: 700; font-size: .95rem; text-align: center; text-decoration: none; cursor: pointer; display: inline-block; }
  .btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
  .btn.good { background: var(--green); border-color: var(--green); color: #fff; }
  .btn.small { flex: 0 1 auto; padding: 7px 14px; font-size: .85rem; }
  .btn:disabled { opacity: .5; }
  .pill { display: inline-block; font-size: .72rem; font-weight: 700; padding: 2px 8px; border-radius: 99px; background: var(--brand-soft); color: var(--brand); margin-left: 6px; vertical-align: 2px; }
  .pill.ok { background: var(--green-soft); color: var(--green); }
  .pill.no { background: var(--red-soft); color: var(--red); }
  .empty { text-align: center; color: var(--muted); padding: 22px 12px; }
  .thread { margin-top: 12px; border-top: 1px solid var(--line); padding-top: 10px; display: none; }
  .open .thread { display: block; }
  .msg { font-size: .88rem; padding: 7px 10px; border-radius: 10px; margin: 5px 0; max-width: 88%; white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg.inbound { background: var(--brand-soft); }
  .msg.outbound { background: var(--bg); border: 1px solid var(--line); margin-left: auto; }
  .msg.system { color: var(--muted); font-size: .8rem; text-align: center; max-width: 100%; }
  .msg time { display: block; font-size: .7rem; color: var(--faint); margin-top: 2px; }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
  .stat { text-align: center; padding: 6px 2px; }
  .stat b { display: block; font-size: 1.5rem; font-weight: 800; }
  .stat span { font-size: .75rem; color: var(--muted); }
  .sentence { margin: 8px 2px 0; color: var(--muted); text-align: center; }
  details.card { padding: 0; }
  details > summary { list-style: none; padding: 14px; font-weight: 700; cursor: pointer; display: flex; justify-content: space-between; }
  details > summary::-webkit-details-marker { display: none; }
  details > summary::after { content: "+"; color: var(--faint); font-weight: 400; }
  details[open] > summary::after { content: "–"; }
  details .inner { padding: 0 14px 14px; }
  .item { display: flex; justify-content: space-between; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); cursor: pointer; font-size: .92rem; }
  .item:first-child { border-top: 0; }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; }
  label.toggle { display: flex; justify-content: space-between; align-items: center; padding: 9px 0; border-top: 1px solid var(--line); gap: 12px; }
  label.toggle:first-child { border-top: 0; }
  input[type=checkbox] { width: 22px; height: 22px; accent-color: var(--brand); flex: none; }
  input[type=search], input[type=password], input[type=url], textarea {
    width: 100%; font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px; margin: 4px 0 10px; }
  textarea { min-height: 70px; resize: vertical; }
  .k { font-size: .8rem; color: var(--muted); font-weight: 600; }
  code { font-size: .9rem; background: var(--bg); border: 1px solid var(--line); padding: 1px 5px; border-radius: 6px; overflow-wrap: anywhere; }
  .toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: .9rem; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: calc(100% - 32px); }
  .toast.on { opacity: 1; }
</style>
</head>
<body>
<main>
  <header>
    <div><h1 id="biz">Cove</h1><div class="sub" id="health"></div></div>
    <span class="net" id="net">Reconnecting…</span>
  </header>

  <h2>Needs you now</h2>
  <div id="now"><div class="card empty">Loading…</div></div>

  <h2>This week</h2>
  <div class="card"><div class="stats" id="stats"></div><p class="sentence" id="sentence"></p></div>

  <h2>Everything else</h2>
  <details class="card"><summary>Older leads</summary><div class="inner">
    <input type="search" id="search" placeholder="Search by phone number" inputmode="tel" />
    <div id="older"></div>
  </div></details>
  <details class="card"><summary>Call forwarding</summary><div class="inner" id="fwd"></div></details>
  <details class="card"><summary>Alerts &amp; follow-up texts</summary><div class="inner" id="alerts"><p class="sub">Loading…</p></div></details>
  <details class="card"><summary>Your question</summary><div class="inner" id="flow"><p class="sub">Loading…</p></div></details>
  <details class="card"><summary>Account</summary><div class="inner">
    <button class="btn" id="test-btn">Send me a test text</button>
    <p class="sub" id="test-note"></p>
    <div class="k" style="margin-top:14px">Change password</div>
    <input type="password" id="pw-old" placeholder="Current password" autocomplete="current-password" />
    <input type="password" id="pw-new" placeholder="New password (8+ characters)" autocomplete="new-password" />
    <div class="row"><button class="btn" id="pw-btn">Change password</button><button class="btn" id="logout">Sign out</button></div>
  </div></details>
</main>
<div class="toast" id="toast" role="status"></div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const state = { leads: new Map(), since: null, business: null, settings: null, flow: null, open: new Set() };

function toast(msg) { const t = $("toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("on"), 2500); }
function setOnline(ok) { $("net").classList.toggle("on", !ok); }

async function api(path, opts = {}) {
  const res = await fetch(path, { ...opts, headers: { "Content-Type": "application/json" }, body: opts.body ? JSON.stringify(opts.body) : undefined });
  if (res.status === 401) { location.href = "/login"; throw new Error("Signed out"); }
  const data = await res.json().catch(() => ({}));
  if (!res.ok || data.ok === false) throw new Error(data.error || `Request failed (${res.status})`);
  return data;
}

// "+61412345678" → "0412 345 678"
function phone(e164) {
  const m = /^\+61(4\d{2})(\d{3})(\d{3})$/.exec(e164 || "");
  if (m) return `0${m[1]} ${m[2]} ${m[3]}`;
  const l = /^\+61(\d)(\d{4})(\d{4})$/.exec(e164 || "");
  return l ? `(0${l[1]}) ${l[2]} ${l[3]}` : (e164 || "Unknown");
}
// Dates in the business's timezone, whatever the phone is set to.
const tz = () => state.business?.operating_hours?.timezone || "Australia/Sydney";
const fmt = (ts, opts) => { try { return new Date(ts).toLocaleString("en-AU", { timeZone: tz(), ...opts }); } catch { return new Date(ts).toLocaleString("en-AU", opts); } };
function ago(ts) {
  const m = Math.round((Date.now() - new Date(ts)) / 60000);
  if (m < 1) return "just now";
  if (m < 60) return `${m} min ago`;
  if (m < 60 * 24) return `${Math.round(m / 60)} h ago`;
  return fmt(ts, { weekday: "short", day: "numeric", month: "short" });
}
const isUrgent = (l) => !!l.answers?.urgent_alert_sent;
function answerOf(l) {
  const a = l.answers || {};
  const key = Object.keys(a).find((k) => k.endsWith("_label") && !k.startsWith("_"));
  if (key) return a[key];
  if (l.status === "stopped") return "Opted out (STOP)";
  if (a._exit_reason === "call_requested") return "Asked you to call them";
  if (l.source === "rebook") return l.message;
  return l.status === "active" ? "Hasn't replied yet" : (l.message || "");
}
function bookingHtml(l) {
  if (!l.appointment_at || !["proposed", "confirmed"].includes(l.booking_status)) return "";
  const day = fmt(l.appointment_at, { weekday: "short", day: "numeric", month: "short" });
  const w = l.answers?._appointment_window;
  const label = w ? `${day}, ${w.name}` : (l.answers?._appointment_label || day);
  const pill = l.booking_status === "confirmed" ? '<span class="pill ok">Confirmed</span>' : '<span class="pill">Waiting on you</span>';
  return `<div class="booking">📅 <b>${esc(label)}</b> ${pill}</div>`;
}
const needsYou = (l) => l.status !== "stopped" && (
  l.booking_status === "proposed" ||
  (!l.answers?._called_back && !l.outcome && Date.now() - new Date(l.created_at) < 48 * 3600e3));

function card(l) {
  const urgent = isUrgent(l);
  const outcome = l.outcome ? `<span class="pill ${l.outcome === "won" ? "ok" : "no"}">${l.outcome === "won" ? "Won" : "Lost"}</span>` : "";
  return `<div class="card lead ${urgent ? "urgent" : ""} ${state.open.has(l.id) ? "open" : ""}" data-id="${l.id}">
    <div class="top" data-act="toggle"><span class="phone">${esc(phone(l.phone))}${l.source === "test" ? '<span class="pill">Test</span>' : ""}${outcome}</span><span class="ago">${ago(l.created_at)}</span></div>
    <p class="answer" data-act="toggle">${urgent ? "🚨 " : ""}${esc(answerOf(l))}</p>
    ${bookingHtml(l)}
    ${l.booking_status === "proposed" ? `<div class="row"><button class="btn good" data-act="confirm">Confirm</button><button class="btn" data-act="decline">Decline</button></div>` : ""}
    <div class="row"><a class="btn primary" href="tel:${esc(l.phone)}">Call</a><a class="btn" href="sms:${esc(l.phone)}">Text</a>
      ${l.answers?._called_back ? "" : `<button class="btn" data-act="done">Done</button>`}</div>
    <div class="thread" id="t-${l.id}"></div>
  </div>`;
}

function render() {
  const all = [...state.leads.values()].sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
  const now = all.filter(needsYou).sort((a, b) => (isUrgent(b) - isUrgent(a)) || (new Date(b.created_at) - new Date(a.created_at)));
  $("now").innerHTML = now.length ? now.map(card).join("")
    : `<div class="card empty">All caught up ✓<br><span class="sub">New missed calls land here.</span></div>`;
  if (!$("search").value) renderOlder(all.filter((l) => !needsYou(l)));
  for (const id of state.open) loadThread(id, false);
}

function renderOlder(list) {
  $("older").innerHTML = list.length ? list.slice(0, 60).map((l) => `<div class="item" data-id="${l.id}" data-act="older">
    <span><b>${esc(phone(l.phone))}</b><br><span class="sub">${esc(answerOf(l))}</span></span>
    <span class="sub" style="text-align:right;white-space:nowrap">${ago(l.created_at)}<br>${l.outcome === "won" ? "Won" : l.outcome === "lost" ? "Lost" : l.answers?._called_back ? "Done" : ""}</span></div>`).join("")
    : `<div class="empty">Nothing here yet.</div>`;
}

const KINDS = { reminder: "Reminder", review_request: "Review request", rebook_nudge: "Rebook nudge", unanswered_nudge: "Follow-up nudge" };
async function loadThread(id, fetchIt = true) {
  const el = $(`t-${id}`);
  if (!el) return;
  if (!fetchIt && el.dataset.html) { el.innerHTML = el.dataset.html; return; }
  try {
    const { lead, messages, scheduled } = await api(`/api/me/leads/${id}`);
    state.leads.set(lead.id, lead);
    const html = messages.map((m) => `<div class="msg ${m.direction}">${esc(m.body)}<time>${ago(m.created_at)}</time></div>`).join("")
      + scheduled.map((s) => `<div class="msg system">⏰ ${KINDS[s.kind] || s.kind} queued for ${esc(fmt(s.send_at, { weekday: "short", hour: "numeric", minute: "2-digit" }))}</div>`).join("")
      + `<div class="row"><button class="btn small" data-act="won">Won the job</button><button class="btn small" data-act="lost">Lost it</button></div>`;
    el.dataset.html = html;
    el.innerHTML = html;
  } catch (e) { el.innerHTML = `<p class="sub">${esc(e.message)}</p>`; }
}

async function act(id, action, btn) {
  if (btn) btn.disabled = true;
  try {
    if (action === "confirm" || action === "decline") {
      const { lead } = await api(`/api/me/leads/${id}/booking`, { method: "POST", body: { action } });
      state.leads.set(id, lead);
      toast(action === "confirm" ? "Confirmed — we've texted them" : "Declined — we've told them you'll call");
    } else if (action === "done") {
      await api(`/api/me/leads/${id}/mark-called`, { method: "POST" });
      const l = state.leads.get(id);
      l.answers = { ...(l.answers || {}), _called_back: true };
      toast("Done");
    } else if (action === "won" || action === "lost") {
      const { lead } = await api(`/api/me/leads/${id}/outcome`, { method: "POST", body: { outcome: action } });
      state.leads.set(id, { ...state.leads.get(id), ...lead });
      toast(action === "won" ? "Nice one — marked won" : "Marked lost");
      loadSummary();
    }
    $(`t-${id}`)?.removeAttribute("data-html");
    render();
  } catch (e) { toast(e.message); if (btn) btn.disabled = false; }
}

document.addEventListener("click", async (e) => {
  const el = e.target.closest("[data-act]");
  if (el) {
    const id = el.closest("[data-id]")?.dataset.id;
    const action = el.dataset.act;
    if (action === "toggle") {
      const box = el.closest(".lead");
      if (box.classList.toggle("open")) { state.open.add(id); loadThread(id); } else state.open.delete(id);
    } else if (action === "older") {
      const l = state.leads.get(id);
      if (l) { state.open.add(id); el.outerHTML = card(l); loadThread(id); }
    } else if (id) act(id, action, el);
    return;
  }
  if (e.target.id === "flow-save") {
    const flow = structuredClone(state.flow);
    flow.steps[0].question = $("q-text").value.trim();
    document.querySelectorAll(".opt").forEach((t) => { flow.steps[0].options[t.dataset.i].label = t.value.trim(); });
    try { await api("/api/me/flow", { method: "PUT", body: { flowConfig: flow } }); state.flow = flow; toast("Question saved"); }
    catch (err) { toast(err.message); }
  } else if (e.target.id === "review-save") {
    try { await api("/api/me/settings", { method: "PUT", body: { review_link: $("review-link").value } }); toast("Saved"); }
    catch (err) { toast(err.message); }
  }
});

async function poll() {
  const since = state.since;
  try {
    const { leads, serverTime } = await api(`/api/me/leads${since ? `?since=${encodeURIComponent(since)}` : "?days=30"}`);
    for (const l of leads) state.leads.set(l.id, { ...state.leads.get(l.id), ...l });
    state.since = serverTime;
    setOnline(true);
    if (leads.length || !since) render();
  } catch { setOnline(false); }
}

async function loadSummary() {
  try {
    const { week } = await api("/api/me/summary");
    $("stats").innerHTML = [["Calls caught", week.leads], ["Replied", week.replied], ["Booked", week.booked], ["Won", week.won]]
      .map(([k, v]) => `<div class="stat"><b>${v}</b><span>${k}</span></div>`).join("");
    $("sentence").textContent = week.leads
      ? `${week.leads} call${week.leads === 1 ? "" : "s"} you'd have lost, ${week.booked} booked.`
      : "No missed calls yet this week.";
  } catch { $("sentence").textContent = "Couldn't load this week's numbers."; }
}

function renderHealth() {
  const last = state.business?.last_inbound_call_at;
  const days = last ? (Date.now() - new Date(last)) / 86400e3 : null;
  const [color, text] = days == null ? ["var(--faint)", "No forwarded calls yet"]
    : days <= 3 ? ["var(--green)", `Forwarding working · last call ${ago(last)}`]
    : days <= 14 ? ["var(--amber)", `Quiet · last forwarded call ${ago(last)}`]
    : ["var(--red)", `No forwarded calls for ${Math.round(days)} days — check forwarding`];
  $("health").innerHTML = `<span class="dot" style="background:${color}"></span>${esc(text)}`;
  const f = state.settings?.forwarding;
  $("fwd").innerHTML = `<p class="sub" style="margin-top:0"><span class="dot" style="background:${color}"></span>${esc(text)}.</p>` + (f ? `
    <p>New phone or carrier? Turn forwarding back on from your mobile:</p>
    <a class="btn primary" href="${esc(f.link)}">Turn on forwarding</a>
    <p class="sub">Or dial <code>${esc(f.codes.noAnswer)}</code> and press call. Forward when busy too: <code>${esc(f.codes.busy)}</code>. Turn it all off: <code>${esc(f.codes.cancelAll)}</code>.</p>` : "");
}

function renderAlerts() {
  const s = state.settings;
  const fu = s.settings.followups;
  const t = (key, label, on, hint = "") => `<label class="toggle"><span>${label}${hint ? `<br><span class="sub">${hint}</span>` : ""}</span><input type="checkbox" data-key="${key}" ${on ? "checked" : ""}></label>`;
  $("alerts").innerHTML = `<div>` +
    t("missed_call_alert", "Text me the moment a call is missed", s.settings.missedCallAlert) +
    t("notifications.sms", "Text me each lead's details", s.notifications.sms) +
    t("notifications.urgent_only", "Only urgent or booked leads", s.notifications.urgent_only, "Details texts for the rest are skipped") +
    t("followups.unanswered_nudge", "Nudge callers who don't reply", fu.unanswered_nudge.enabled, "Once, 2 hours later, in your hours") +
    t("followups.reminder", "Remind customers the evening before", fu.reminder.enabled, "After you confirm a booking") +
    t("followups.review_request", "Ask for a Google review", fu.review_request.enabled, "Morning after you mark a job won") +
    t("followups.rebook_nudge", "Offer a check-up months later", fu.rebook_nudge.enabled) +
    `</div><div class="k" style="margin-top:12px">Google review link</div>
     <input type="url" id="review-link" placeholder="https://g.page/r/…" value="${esc(s.review_link || "")}">
     <button class="btn" id="review-save">Save review link</button>`;
}

document.addEventListener("change", async (e) => {
  const key = e.target.dataset?.key;
  if (!key) return;
  const [a, b] = key.split(".");
  const body = a === "followups" ? { followups: { [b]: { enabled: e.target.checked } } }
    : a === "notifications" ? { notifications: { [b]: e.target.checked } } : { [a]: e.target.checked };
  try { await api("/api/me/settings", { method: "PUT", body }); toast("Saved"); }
  catch (err) { toast(err.message); e.target.checked = !e.target.checked; }
});

function renderFlow() {
  const step = state.flow.steps[0];
  $("flow").innerHTML = `<p class="sub" style="margin-top:0">The one question missed callers get. Keep the letters or numbers in the question matching the options.</p>
    <div class="k">Question</div><textarea id="q-text" rows="5">${esc(step.question)}</textarea>
    ${(step.options || []).map((o, i) => `<div class="k">Option ${esc(o.value)}</div><textarea class="opt" data-i="${i}" style="min-height:44px" rows="1">${esc(o.label)}</textarea>`).join("")}
    <button class="btn primary" id="flow-save">Save question</button>`;
}

$("test-btn").onclick = async () => {
  $("test-btn").disabled = true;
  try { await api("/api/me/send-test-lead", { method: "POST" }); $("test-note").textContent = "Sent — reply on your phone like a customer would."; poll(); }
  catch (e) { $("test-note").textContent = e.message; }
  $("test-btn").disabled = false;
};
$("pw-btn").onclick = async () => {
  try {
    await api("/api/auth/update-profile", { method: "PATCH", body: { currentPassword: $("pw-old").value, newPassword: $("pw-new").value } });
    toast("Password changed"); $("pw-old").value = $("pw-new").value = "";
  } catch (e) { toast(e.message); }
};
$("logout").onclick = async () => { await fetch("/api/auth/logout", { method: "POST" }); location.href = "/login"; };

let searchTimer;
$("search").oninput = () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(async () => {
    const q = $("search").value.replace(/\D/g, "");
    if (q.length < 3) return render();
    try { const { leads } = await api(`/api/me/leads?q=${q}`); leads.forEach((l) => state.leads.set(l.id, l)); renderOlder(leads); }
    catch { setOnline(false); }
  }, 300);
};

(async function start() {
  try {
    const me = await api("/api/auth/me");
    if (!me.business) {
      document.querySelector("main").innerHTML = `<div class="card empty" style="margin-top:20vh">Your Cove account isn't set up yet.<br>Kris will let you know when it is.</div>`;
      return;
    }
    state.business = me.business;
    $("biz").textContent = me.business.name;
    document.title = `${me.business.name} · Cove`;
  } catch { return; }
  await poll();
  loadSummary();
  api("/api/me/settings").then((s) => { state.settings = s; renderHealth(); renderAlerts(); }).catch(() => renderHealth());
  api("/api/me/flow").then(({ flow }) => { state.flow = flow; renderFlow(); }).catch(() => {});
  setInterval(poll, 30_000);
  setInterval(() => {
    loadSummary();
    api("/api/me/business").then(({ business }) => { state.business = business; renderHealth(); }).catch(() => {});
  }, 5 * 60_000);
  setInterval(render, 60_000); // keep "x min ago" fresh
})();
</script>
</body>
</html>
