<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in — Cove</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/dash.css" />
</head>
<body class="auth-root">

  <div class="auth-card">
    <div class="auth-logo">
      <a href="/" class="cove-logo">
        <svg width="30" height="30" viewBox="0 0 28 28" fill="none">
          <path d="M5 19.5 Q9 17 14 19.5 Q19 22 23 19.5" stroke="#e8540a" stroke-width="2.3" stroke-linecap="round" fill="none"/>
          <path d="M5 14.5 Q9 12 14 14.5 Q19 17 23 14.5" stroke="#e8540a" stroke-width="2.3" stroke-linecap="round" fill="none" opacity="0.65"/>
          <path d="M5 9.5 Q9 7 14 9.5 Q19 12 23 9.5" stroke="url(#lg)" stroke-width="2.3" stroke-linecap="round" fill="none" opacity="0.4"/>
          <defs>
            <linearGradient id="lg" x1="5" y1="9.5" x2="23" y2="9.5" gradientUnits="userSpaceOnUse">
              <stop stop-color="#e8540a"/>
              <stop offset="1" stop-color="#ff7240"/>
            </linearGradient>
          </defs>
        </svg>
        <span>cove</span>
      </a>
    </div>

    <!-- Sign in view -->
    <div id="view-login">
      <h1 class="auth-heading">Welcome back</h1>
      <p class="auth-sub">Sign in to your Cove account.</p>

      <div id="login-error" class="auth-error" role="alert"></div>

      <div class="auth-form">
        <div class="field">
          <label for="login-email">Email</label>
          <input type="email" id="login-email" placeholder="you@business.com.au" autocomplete="email" />
        </div>
        <div class="field">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" placeholder="••••••••" autocomplete="current-password" />
        </div>

        <button class="btn btn--primary btn--full btn--lg" id="login-btn" type="button">Sign in</button>
      </div>

      <div class="auth-footer">
        Forgot your password? Text Kris and he'll reset it for you.
      </div>
    </div>

    <div class="auth-back-wrap">
      <a href="/" class="auth-back">← Back to usecove.app</a>
    </div>
  </div>

  <script>
    const loginError = document.getElementById('login-error');

    async function apiPost(url, body) {
      const r = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      return r.json();
    }

    document.getElementById('login-btn').addEventListener('click', async () => {
      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;
      loginError.classList.remove('visible');

      if (!email || !password) {
        loginError.textContent = 'Please enter your email and password.';
        loginError.classList.add('visible');
        return;
      }

      const btn = document.getElementById('login-btn');
      btn.disabled = true;
      btn.textContent = 'Signing in…';

      const data = await apiPost('/api/auth/login', { email, password }).catch(() => ({ ok: false }));

      if (data.ok) {
        location.href = '/dashboard';
      } else {
        loginError.textContent = data.error || 'Could not sign in.';
        loginError.classList.add('visible');
        btn.disabled = false;
        btn.textContent = 'Sign in';
      }
    });

    document.getElementById('login-password').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') document.getElementById('login-btn').click();
    });
  </script>
</body>
</html>
