<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#fafaf8" />
<title>Sign in · Cove</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root { --bg: #fafaf8; --card: #fff; --ink: #18181b; --muted: #6b6b73; --line: #e7e5e0; --brand: #e8540a; --red: #dc2626; --red-soft: #fef2f2; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111110; --card: #1c1c1a; --ink: #f4f4f5; --muted: #a1a1aa; --line: #2e2e2b; --red-soft: #2a1414; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink); font: 16px/1.45 "Plus Jakarta Sans", system-ui, sans-serif;
    display: flex; align-items: center; justify-content: center; padding: 16px; }
  main { width: 100%; max-width: 380px; }
  .logo { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 1.3rem; color: var(--ink); text-decoration: none; margin-bottom: 24px; }
  form { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 22px; }
  h1 { margin: 0 0 4px; font-size: 1.3rem; }
  p { margin: 0 0 18px; color: var(--muted); font-size: .92rem; }
  label { display: block; font-size: .85rem; font-weight: 600; margin-bottom: 4px; }
  input[type=email], input[type=password] { width: 100%; font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line);
    border-radius: 10px; padding: 12px; margin-bottom: 14px; }
  .remember { display: flex; align-items: center; gap: 8px; font-weight: 500; margin: 2px 0 18px; }
  .remember input { width: 20px; height: 20px; accent-color: var(--brand); }
  button { width: 100%; border: 0; border-radius: 10px; background: var(--brand); color: #fff; font: inherit; font-weight: 700; padding: 13px; cursor: pointer; }
  button:disabled { opacity: .6; }
  .error { display: none; background: var(--red-soft); color: var(--red); border-radius: 10px; padding: 10px 12px; font-size: .9rem; margin-bottom: 14px; }
  .error.on { display: block; }
  .foot { text-align: center; color: var(--muted); font-size: .85rem; margin-top: 16px; }
  .foot a { color: var(--muted); }
</style>
</head>
<body>
<main>
  <a class="logo" href="/">
    <svg width="28" height="28" viewBox="0 0 28 28" fill="none" aria-hidden="true"><path d="M5 19.5 Q9 17 14 19.5 Q19 22 23 19.5" stroke="#e8540a" stroke-width="2.3" stroke-linecap="round"/><path d="M5 14.5 Q9 12 14 14.5 Q19 17 23 14.5" stroke="#e8540a" stroke-width="2.3" stroke-linecap="round" opacity="0.6"/><path d="M5 9.5 Q9 7 14 9.5 Q19 12 23 9.5" stroke="#e8540a" stroke-width="2.3" stroke-linecap="round" opacity="0.35"/></svg>
    cove
  </a>
  <form id="form" novalidate>
    <h1>Sign in</h1>
    <p>See who called and who to ring back.</p>
    <div class="error" id="error" role="alert"></div>
    <label for="email">Email</label>
    <input type="email" id="email" autocomplete="email" required />
    <label for="password">Password</label>
    <input type="password" id="password" autocomplete="current-password" required />
    <label class="remember"><input type="checkbox" id="remember" checked /> Stay signed in for 30 days</label>
    <button type="submit" id="btn">Sign in</button>
  </form>
  <div class="foot">Forgot your password? Text Kris and he'll reset it.<br><a href="/privacy">Privacy</a> · <a href="/terms">Terms</a></div>
</main>
<script>
  const form = document.getElementById("form");
  const error = document.getElementById("error");
  const btn = document.getElementById("btn");
  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    error.classList.remove("on");
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    if (!email || !password) { error.textContent = "Enter your email and password."; error.classList.add("on"); return; }
    btn.disabled = true; btn.textContent = "Signing in…";
    try {
      const res = await fetch("/api/auth/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, password, remember: document.getElementById("remember").checked }),
      });
      const data = await res.json().catch(() => ({}));
      if (data.ok) { location.href = "/dashboard"; return; }
      error.textContent = data.error || "Couldn't sign in.";
    } catch { error.textContent = "No connection — try again."; }
    error.classList.add("on");
    btn.disabled = false; btn.textContent = "Sign in";
  });
</script>
</body>
</html>
